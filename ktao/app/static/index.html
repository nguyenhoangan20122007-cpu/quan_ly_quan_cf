<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Quản lý quán cà phê</title><style>body{font-family:Arial;background:#f7f1e8;margin:0;color:#3b2b21}header{background:#63452e;color:white;padding:24px;text-align:center}main{max-width:850px;margin:30px auto}.khung{background:white;border-radius:12px;padding:20px;margin:15px}input,button{padding:10px;margin:5px}button{background:#63452e;color:white;border:0;border-radius:5px}</style></head><body><header><h1>☕ Quản lý quán cà phê</h1><p>Demo khởi tạo dự án</p></header><main><section class="khung"><h2>Thêm danh mục</h2><input id="ten_danh_muc" placeholder="Tên danh mục"><button onclick="themDanhMuc()">Thêm</button></section><section class="khung"><h2>Danh mục</h2><ul id="danh_sach_danh_muc"></ul></section><section class="khung"><h2>Sản phẩm</h2><ul id="danh_sach_san_pham"></ul><p>Thử thêm sản phẩm và đơn hàng tại <a href="/docs">Swagger API</a>.</p></section></main><script>
function anToan(chuoi){return String(chuoi).replace(/[&<>"']/g, ky_tu=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ky_tu]));}
async function taiDuLieu(){const danh_muc=await(await fetch('/categories')).json();document.querySelector('#danh_sach_danh_muc').innerHTML=danh_muc.map(muc=>`<li>${anToan(muc.ten)}</li>`).join('')||'<li>Chưa có danh mục</li>';const san_pham=await(await fetch('/products')).json();document.querySelector('#danh_sach_san_pham').innerHTML=san_pham.map(sp=>`<li>${anToan(sp.ten)} - ${Number(sp.gia).toLocaleString('vi-VN')} đ</li>`).join('')||'<li>Chưa có sản phẩm</li>';}
async function themDanhMuc(){const ten=document.querySelector('#ten_danh_muc').value.trim();if(!ten)return;const ket_qua=await fetch('/categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ten})});if(!ket_qua.ok){alert('Không thêm được danh mục');return;}document.querySelector('#ten_danh_muc').value='';taiDuLieu();}taiDuLieu();
</script></body></html>
